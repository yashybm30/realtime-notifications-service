name: CI
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm audit --omit=dev --audit-level=high
      - run: docker build -t portfolio-app:ci .

  integration:
    runs-on: ubuntu-22.04
    env:
      JWT_SECRET: integration-only-ci-signing-key-with-no-production-use-123456
      REDIS_URL: redis://localhost:6379
      DATABASE_URL: postgresql://postgres:local-development-only@localhost:55432/portfolio
      PGSCHEMA: public
      AWS_REGION: us-east-1
      AWS_ACCESS_KEY_ID: local-minio
      AWS_SECRET_ACCESS_KEY: local-minio-password
      S3_ENDPOINT: http://localhost:9000
      S3_BUCKET: media
      CDN_ORIGIN: http://localhost:9000/media
      PUPPETEER_SKIP_DOWNLOAD: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: docker compose up --wait redis
      - run: npm run test:integration
      - if: failure()
        run: docker compose logs --no-color
      - if: always()
        run: docker compose down
