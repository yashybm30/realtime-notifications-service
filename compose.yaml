services:
  redis:
    image: redis:7-alpine
    ports: ["127.0.0.1:6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 1s
      retries: 30
  app:
    build: .
    ports: ["3000:3000"]
    environment:
      REDIS_URL: redis://redis:6379
      JWT_SECRET: ${JWT_SECRET:?Set a random JWT_SECRET of at least 48 characters}
    depends_on:
      redis:
        condition: service_healthy
